# 出处：lingxi .github/ISSUE_TEMPLATE/decision.yml（https://github.com/Moshuiwang/lingxi/blob/caa845d77fbd2d6381de304dc6047498aa84c782/.github/ISSUE_TEMPLATE/decision.yml）；验证：约 220 个 Issue；分档 G2（占位改为本仓库文档路径）。
name: 决策请求
description: 请求产品负责人确认会阻塞变更实施的选择
title: "[decision] "
labels: ["待决策"]
body:
  - type: input
    id: related_change
    attributes:
      label: 关联变更 / 当前合同
      placeholder: "关联 Issue #；docs/产品合同.md「<章节名>」或 docs/决策记录/ 文件"
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: 需要确认的决定
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: 候选方案及影响
      description: 逐个方案说明用户体验、外部依赖、安全影响，以及代码变动面、架构变动（接口 / 数据库）、测试与部署成本、可逆性。只写可核对的事实，“可不可承受”由产品负责人判断；不要由代理擅自选定。
    validations:
      required: true
  - type: textarea
    id: deadline
    attributes:
      label: 不决策时的影响
      description: 说明哪些实现被阻塞、是否存在安全的研究工作。
  - type: checkboxes
    id: record
    attributes:
      label: 决策归档
      options:
        - label: 若本次决定在 Issue 关闭后仍有效，将把结论回写到 docs/ 的产品合同、当前能力或长期决策记录。
          required: true

name: Story Fast

# 出处：lingxi https://github.com/Moshuiwang/lingxi/issues/82（分层 CI：classify → docs / fast / full）、
# https://github.com/Moshuiwang/lingxi/issues/43（瘦身）；验证：2026-08-07 起约 250 个 PR。
#
# Story PR（→ epic/**）只跑对本次改动适用的那一层：纯文档只跑文档门禁；普通代码跑无真库、
# 无镜像的快检；部署、依赖、CI 自身与未知路径一律升级到完整门禁（复用 ci.yml，不复制）。
# required check 只认下面 story-result 那个稳定名称 `Story Fast`。

on:
  pull_request:
    branches:
      - 'epic/**'

permissions:
  contents: read

concurrency:
  group: story-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    name: Story / classify
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      mode: ${{ steps.changes.outputs.mode }}
      docs_changed: ${{ steps.changes.outputs.docs_changed }}
    steps:
      - name: 检出代码与比较基线
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 路由改动
        id: changes
        run: |
          python3 scripts/ci/classify_story_changes.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --github-output "${GITHUB_OUTPUT}"

  docs:
    name: Story / docs
    needs: classify
    if: needs.classify.outputs.docs_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 运行文档门禁
        run: scripts/ci/verify_docs.sh

  fast:
    name: Story / code fast
    needs: classify
    if: needs.classify.outputs.mode == 'fast'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 固定小版本而不是读 pyproject 的 ">=3.12"：后者是开区间，新 Python 发布时门禁会自己
      # 跳版本。verify_repository.sh 另有一道校验，确保这里不低于 pyproject 声明的下限。
      - name: 配置 Python 运行时
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      # extras 只写在这一行：scripts/dev/gate_spec.py 现读它给本机 check.sh 用，改了名字或写法
      # 本机会响亮失败。shellcheck 版本锁在 pyproject.toml 的 dev 组里，随这一行装进来。
      - name: 安装快速门禁依赖
        run: python3 -m pip install '.[dev]'

      - name: 运行无真库、无镜像的仓库门禁
        run: scripts/ci/verify_repository.sh

      - name: 校验门禁没有改写工作树
        run: test -z "$(git status --porcelain)"

  full:
    name: Story / high-risk full
    needs: classify
    if: needs.classify.outputs.mode == 'full'
    uses: ./.github/workflows/ci.yml

  story-result:
    name: Story Fast
    needs: [classify, docs, fast, full]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: 汇总唯一适用的门禁
        env:
          MODE: ${{ needs.classify.outputs.mode }}
          DOCS_CHANGED: ${{ needs.classify.outputs.docs_changed }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          FAST_RESULT: ${{ needs.fast.result }}
          FULL_RESULT: ${{ needs.full.result }}
        run: |
          if [ "${CLASSIFY_RESULT}" != success ]; then
            echo 'Story 路由失败' >&2
            exit 1
          fi
          if [ "${DOCS_CHANGED}" = true ] && [ "${DOCS_RESULT}" != success ]; then
            echo "Story 文档门禁未通过：${DOCS_RESULT}" >&2
            exit 1
          fi
          case "${MODE}" in
            docs) selected=${DOCS_RESULT} ;;
            fast) selected=${FAST_RESULT} ;;
            full) selected=${FULL_RESULT} ;;
            *) echo "未知 Story 路由：${MODE}" >&2; exit 1 ;;
          esac
          if [ "${selected}" != success ]; then
            echo "Story ${MODE} 门禁未通过：${selected}" >&2
            exit 1
          fi
          echo "Story ${MODE} 门禁：通过"
